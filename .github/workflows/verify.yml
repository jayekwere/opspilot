name: Verify OpsPilot
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip==26.2.2 && .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci --ignore-scripts
      - run: make check test build demo benchmark
      - run: .venv/bin/bandit -r opspilot -ll
      - run: .venv/bin/pip-audit -r requirements.lock
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: make container
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-evidence
          path: |
            coverage.xml
            docs/demo-result.json
            docs/benchmark.json
            docs/screenshots/
            playwright-report/
          retention-days: 14
  release-image:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and publish release image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --target runtime -t "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}" .
          docker push "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
