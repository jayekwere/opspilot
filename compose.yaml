services:
  opspilot:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPSPILOT_IDENTITIES: ${OPSPILOT_IDENTITIES:?Generate separate operator and approver credentials first}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /state:size=32m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    init: true
