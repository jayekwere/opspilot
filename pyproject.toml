[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.1"
description = "Auditable operational diagnostics and approved disposable-lab recovery"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55", "pydantic>=2.14,<2.15", "httpx>=0.28,<0.29"]

[project.scripts]
opspilot = "opspilot.cli:main"

[tool.setuptools.packages.find]
include = ["opspilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=opspilot --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
